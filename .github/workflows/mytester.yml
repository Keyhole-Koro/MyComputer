name: CI - Kernel Build Diagnostic

on:
  pull_request:
    branches:
      - main

jobs:
  diagnose-kernel-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++

      - name: Run pinned component-owned suites
        run: make qa ARGS="compiler assembler linker emulator --jobs 1"

      - name: Run pinned toolchain E2E suites
        run: make qa ARGS="compiler-e2e assembler-e2e --jobs 1"

      - name: Capture kernel build
        id: kernel
        shell: bash
        run: |
          set +e
          make kernel-build > kernel-build.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 200 kernel-build.log
          exit 0

      - name: Upload kernel build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-log
          path: kernel-build.log
          if-no-files-found: error

      - name: Fail on kernel build error
        if: steps.kernel.outputs.status != '0'
        run: exit 1

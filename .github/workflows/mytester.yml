name: CI - MyTester

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  mytester-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++

      - name: Verify Python scripts
        run: |
          python3 -m py_compile \
            tools/project_paths.py \
            qa/runners/build_toolchain.py \
            qa/runners/run_kernel.py \
            qa/runners/run_mylang.py \
            qa/runners/run_system.py \
            qa/tools/debug_session.py \
            qa/tools/profile_report.py \
            qa/tests/test-all.py

      - name: Run pinned component-owned suites
        run: make qa ARGS="compiler assembler linker emulator --jobs 1"

      - name: Run pinned toolchain E2E suites
        run: make qa ARGS="compiler-e2e assembler-e2e --jobs 1 --verbose"

      - name: Build kernel image
        run: make kernel-build

      - name: Run serial RX test
        run: make serial-rx-test

      - name: Run DOM lowering test
        run: make dom-test

      - name: Run MyDOMTester E2E (headless UI automation, MYOS-004)
        run: make dom-tester-test
